{% set name = "binutils-gold" %}
{% set version = "2.44" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://ftp.gnu.org/gnu/binutils/binutils-with-gold-{{ version }}.tar.xz
  sha256: 67be9198476cc37436e2801de649f4ad80bf0d02430d86aff63c6b59b6e23987

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make
    - flex
    - bison
  host:
    - zlib
  run:
    - zlib

test:
  commands:
    - ld.gold --version
    - ld.gold --help

about:
  home: https://www.gnu.org/software/binutils/
  summary: 'GNU gold linker - A fast ELF-only linker (deprecated)'
  description: |
    Gold is a new, faster, ELF only linker intended to have complete support 
    for ELF and to run as fast as possible on modern systems. For normal use 
    it is a drop-in replacement for the older GNU linker.
    
    WARNING: Gold is deprecated upstream and is being removed from future 
    versions of binutils. This package is provided for compatibility with 
    existing software that requires the gold linker.
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: COPYING3
  doc_url: https://sourceware.org/binutils/docs/
  dev_url: https://sourceware.org/git/gitweb.cgi?p=binutils-gdb.git

extra:
  recipe-maintainers:
    # Add your GitHub username here when submitting
    - your-github-username